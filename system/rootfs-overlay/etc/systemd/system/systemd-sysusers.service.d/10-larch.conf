# larch-os — create missing system users and groups at every boot, not only
# when /usr is newer than /etc/.updated (ConditionNeedsUpdate=/etc, cleared
# here). The account files on LARCHCONF (/etc's overlay) carry over updates
# and desktop switches, and a desktop's system users (COSMIC's greetd and
# cosmic-greeter, GNOME's gdm, …) must be there before its display manager
# starts: switching to a desktop whose layer is older than the stamp (or to
# an older release) left them missing, and the greeter never started.
# systemd-sysusers writes nothing when every user and group in sysusers.d
# exists, so this costs nothing on an ordinary boot.
[Unit]
ConditionNeedsUpdate=
