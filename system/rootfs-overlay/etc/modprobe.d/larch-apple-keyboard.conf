# Apple keyboards: swap Option and Command, so the keys beside the space bar
# are laid out as on a PC keyboard (Super next to Alt, Alt next to the space
# bar). Done by the kernel driver, so it holds for every desktop, the login
# screen and the initramfs menus alike (the initramfs carry the image's
# modprobe.d; hid_apple is in MODS_INPUT).
options hid_apple swap_opt_cmd=1
